name: Build macOS

on:
  push:
    branches:
      - main
      - dev-v2
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goarch: arm64
          - runner: macos-13
            goarch: amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            go.work.sum
            core/go.sum
            agent/go.sum
            cmd/macpanel/go.sum
            pkg/platform/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:pro

      - name: Build macpanel binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          go work sync
          mkdir -p build
          cd cmd/macpanel && CGO_ENABLED=0 GOOS=darwin GOARCH=${GOARCH} go build -trimpath -ldflags '-s -w' -o ../../build/macpanel .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macpanel-darwin-${{ matrix.goarch }}
          path: build/macpanel
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macpanel-darwin-arm64
          path: artifacts/arm64

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macpanel-darwin-amd64
          path: artifacts/amd64

      - name: Prepare release assets
        run: |
          mv artifacts/arm64/macpanel artifacts/arm64/macpanel-darwin-arm64
          mv artifacts/amd64/macpanel artifacts/amd64/macpanel-darwin-amd64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/arm64/macpanel-darwin-arm64
            artifacts/amd64/macpanel-darwin-amd64
